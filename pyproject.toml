[project]
name = "agentcore-studio-kb"
version = "0.1.0"
description = "AgentCore Studio — KB pipeline + fence-DATA (kb.search, chunk-level RLS). Owner: DE."
requires-python = ">=3.14"
dependencies = [
    "agentcore-studio-contracts",
    "psycopg[binary,pool]>=3.2",
    # `.docx` extractor cho chunker đa định dạng (plans/multiformat_chunker_plan.md) — đọc XML/zip
    # thuần Python, không cần binary hệ thống (khác `.doc` nhị phân cũ, cố ý ngoài phạm vi).
    "python-docx>=1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/studio_kb"]
